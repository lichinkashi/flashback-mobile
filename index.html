<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashback Mobile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #fff; 
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .logo { font-size: 80px; margin-bottom: 20px; }
        h1 { font-size: 32px; margin-bottom: 10px; color: #8B0000; }
        .subtitle { font-size: 18px; margin-bottom: 30px; opacity: 0.8; }
        .apk-download {
            background: #8B0000;
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 20px;
            margin: 20px 0;
            display: inline-block;
        }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
            max-width: 400px;
        }
        .feature {
            background: rgba(139, 0, 0, 0.3);
            padding: 15px;
            border-radius: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="logo">📸</div>
    <h1>Flashback Mobile</h1>
    <div class="subtitle">Ностальгия в жестах • Android APK</div>
    
    <a href="https://github.com/lichinkashi/flashback-mobile/releases/latest/download/app-release.apk" class="apk-download">
        📲 Скачать APK
    </a>
    
    <div class="features">
        <div class="feature">🎮 Диагональные жесты</div>
        <div class="feature">❤️ Система избранного</div>
        <div class="feature">📱 Работает офлайн</div>
        <div class="feature">🔍 Умный поиск</div>
    </div>
    
    <p style="opacity: 0.7; margin-top: 20px;">
        Нажмите "Скачать APK" для установки на Android
    </p>
</body>
</html>
