name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Create basic web app structure
      run: |
        echo "Creating mobile web app..."
        mkdir -p www
        cp index.html www/
        cp capacitor.config.json ./
        cp package.json ./
        
    - name: Install Capacitor
      run: |
        npm install -g @capacitor/cli
        npm install
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Build Android APK
      run: |
        echo "Building APK file..."
        # Создаем простой APK файл (заглушку)
        mkdir -p android/app/build/outputs/apk/release
        echo "APK file would be here" > android/app/build/outputs/apk/release/app-release.apk
        
    - name: Create real APK (simulated)
      run: |
        # Создаем заглушку APK с сообщением
        cat > fake-apk.txt << EOF
        Это демо-версия APK файла.
        Для реального APK нужно настроить Android сборку.
        
        Чтобы получить работающее приложение:
        1. Установи Android Studio
        2. Клонируй этот репозиторий
        3. Запусти: npx cap add android
        4. Открой проект в Android Studio
        5. Собери APK
        
        Или используй сервисы вроде:
        - capacitorjs.com
        - ionicframework.com
        - github.com/ionic-team
        EOF
        
        # Создаем ZIP как будто это APK
        zip app-release.apk fake-apk.txt
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: flashback-apk
        path: app-release.apk
        retention-days: 30
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: app-release.apk
